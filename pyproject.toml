[project]
name = "nettlesome"
version = "0.8.0"
description = "Simplified semantic reasoning in Python"
readme = "readme.md"
requires-python = ">=3.14"
authors = [
    {name = "Matt Carey", email = "matt@authorityspoke.com"},
]
license-files = ["license.md"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]
dependencies = [
    "pint>=0.25.3",
    "pydantic>=2.13.3",
    "pydantic-pint>=0.7.0",
    "python-slugify>=8.0.4",
    "sympy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
ignore = ["PLR0124", "SIM201"]

[dependency-groups]
build = [
    "build",
    "twine",
]
dev = [
    "pytest-cov>=7.1.0",
    "pytest>=9.0.3",
    "pytest-recording>=0.13.4",
]
docs = [
    "sphinx-autodoc-typehints>=3.17.2",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
]
